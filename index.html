<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <title>Event Registration</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            'sans': ['PT Sans', 'ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'Noto Sans', 'sans-serif']
          },
          colors: {
            custom: {
              'background': 'hsl(210, 10%, 15%)',
              'card': 'hsl(210, 10%, 18%)', 
              'primary': 'hsl(210, 45%, 60%)',
              'secondary': 'hsl(210, 10%, 25%)',
              'muted': 'hsl(210, 10%, 25%)',
              'border': 'hsl(210, 10%, 30%)',
              'input': 'hsl(210, 10%, 28%)',
              'foreground': 'hsl(210, 10%, 85%)'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="font-sans flex items-center justify-center min-h-screen relative" style="background-color: hsl(210, 10%, 15%)">

  <div id="message" class="absolute top-10 left-1/2 transform -translate-x-1/2 w-96 z-50 pointer-events-none"></div>

  <div class="card w-96 p-6 shadow-2xl rounded-2xl relative overflow-hidden hover:shadow-[0_10px_30px_rgba(0,0,0,0.5)] transition-shadow duration-300 animate-border-glow" style="background-color: hsl(210, 10%, 18%)">
    <h2 class="text-2xl font-bold text-center mb-6" style="color: hsl(210, 10%, 85%)">Event Registration</h2>
    
    <form id="registrationForm" class="space-y-6" novalidate>
      <div class="flex items-center rounded-lg px-3 py-2 transition-all duration-200 shadow-inner shadow-black/20 hover:opacity-90 focus-within:ring-1" 
           style="background-color: hsl(210, 10%, 28%); border: 1px solid hsl(210, 10%, 30%); --tw-ring-color: hsl(210, 45%, 60%);">
        <i data-lucide="user" class="w-5 h-5 mr-2 flex-shrink-0" style="color: hsl(210, 10%, 85%); opacity: 0.7;"></i>
        <input type="text" id="name" placeholder="Name" class="w-full bg-transparent outline-none transition-all duration-200 font-normal placeholder:font-light" style="color: hsl(210, 10%, 85%);"/>
      </div>

      <div class="flex items-center rounded-lg px-3 py-2 transition-all duration-200 shadow-inner shadow-black/20 hover:opacity-90 focus-within:ring-1" 
           style="background-color: hsl(210, 10%, 28%); border: 1px solid hsl(210, 10%, 30%); --tw-ring-color: hsl(210, 45%, 60%);">
        <i data-lucide="mail" class="w-5 h-5 mr-2 flex-shrink-0" style="color: hsl(210, 10%, 85%); opacity: 0.7;"></i>
        <input type="email" id="email" placeholder="Email" class="w-full bg-transparent outline-none transition-all duration-200 font-normal placeholder:font-light" style="color: hsl(210, 10%, 85%);"/>
      </div>

      <button type="submit" class="w-full py-2 px-4 font-medium rounded-lg transition-colors shadow-lg hover:opacity-90" 
              style="background-color: hsl(210, 45%, 60%); color: hsl(210, 10%, 85%);">
        Register
      </button>
    </form>
  </div>

  <script>
const form = document.getElementById('registrationForm');
const message = document.getElementById('message');

const showMessage = (type, text) => {
  let bgColor, textColor;
  const icon = type === 'success' ? '✅' : '❌';

  if(type === 'success') {
    bgColor = '#94a3b8'; // light gray background
    textColor = '#0f172a'; // dark text
  } else {
    bgColor = '#ef4444'; // red background
    textColor = '#f8fafc'; // light text
  }
  
  message.innerHTML = `
    <div class="alert-popup flex items-center gap-2 px-4 py-2 rounded-lg shadow-lg animate-float-in" style="background-color: ${bgColor}; color: ${textColor};">
      <span class="text-lg">${icon}</span>
      <span>${text}</span>
    </div>
  `;

  const alertDiv = message.querySelector('.alert-popup');

  setTimeout(() => {
    alertDiv.classList.remove('animate-float-in');
    alertDiv.classList.add('animate-float-out');
  }, 5000);

  setTimeout(() => { message.innerHTML = ''; }, 5300);
};

// Make sure to only attach one submit listener
form.onsubmit = async function(e) {
  // 🔑 Essential for preventing the browser's default page reload
  e.preventDefault(); 

  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();

  if (!name || !email) {
    showMessage('error', 'All fields are required!');
    return;
  }

  if (!/\S+@\S+\.\S+/.test(email)) {
    showMessage('error', 'Invalid email format!');
    return;
  }

  try {
    const res = await fetch('http://localhost:3000/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, email })
    });
    const data = await res.json();

    showMessage('success', data.message);
    form.reset(); // clears form without reload
  } catch (err) {
    // This catch block should now only be hit by local script errors, not failed network requests
    showMessage('error', 'Critical Error: Form failed to process!');
    console.error("Form processing error:", err);
  }
};

  </script>

  <script>
    // Initialize Lucide icons after page load
    document.addEventListener('DOMContentLoaded', function() {
      if (typeof lucide !== 'undefined') {
        lucide.createIcons();
      }
    });
  </script>

  <style>
    body {
      background: hsl(210, 10%, 15%);
      font-family: 'PT Sans', ui-sans-serif, system-ui, sans-serif;
    }

    @keyframes float-in {
      0% { opacity: 0; transform: translateY(-10px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .animate-float-in { animation: float-in 0.3s ease forwards; }

    @keyframes float-out {
      0% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-10px); }
    }
    .animate-float-out { animation: float-out 0.3s ease forwards; }

    @keyframes border-glow {
      0% { border-color: hsla(210, 45%, 60%, 0.3); }
      50% { border-color: hsla(210, 45%, 60%, 0.8); }
      100% { border-color: hsla(210, 45%, 60%, 0.3); }
    }
    .animate-border-glow {
      border-width: 2px;
      border-style: solid;
      border-color: hsla(210, 45%, 60%, 0.3);
      animation: border-glow 5s infinite;
    }
  </style>
</body>
</html>
